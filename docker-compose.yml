services:
  dnsmasq:
    container_name: dnsmasq
    image: ghcr.io/wh0else/dnsmasq:latest
    network_mode: host
    environment:
      TZ: 'Europe/Oslo'
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
      - ./dnsmasq.d-etc/:/etc/dnsmasq.d
      - /usr/local/share/ca-certificates/sovik-root-ca.crt:/etc/ssl/certs/753f4e20.0:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

networks:
  inet6:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: "2001:67c:228c:100::/64"
